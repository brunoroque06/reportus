[project]
name = "reportus"
version = "0.1.0"
dependencies = [
  "streamlit==1.64.0",
]

[dependency-groups]
dev = [
  "pyrefly==1.3.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
  "watchdog==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyrefly]
preset = "strict"
search_path = ["."]

[tool.ruff]
lint.ignore = ["E501", "E741"]
